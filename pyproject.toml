[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowpack-sentinel"
version = "0.1.0"
description = "Low-power snow station pipeline: LoRaWAN codec, SLF IMIS ingestion, snowpack indicators, alert JSON."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
snowpack = "snowpack.cli:main"

[tool.setuptools]
packages = ["snowpack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio"
